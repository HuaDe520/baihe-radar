name: probe pages enable

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe pages api
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          mkdir -p _probe
          {
            echo "== GET rate_limit =="
            curl -sS -w '\nHTTP:%{http_code}\n' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/rate_limit
            echo "== GET pages =="
            curl -sS -w '\nHTTP:%{http_code}\n' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/$REPO/pages
            echo "== POST pages build_type=workflow =="
            curl -sS -w '\nHTTP:%{http_code}\n' -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/$REPO/pages -d '{"build_type":"workflow"}'
            echo "== GET pages again =="
            curl -sS -w '\nHTTP:%{http_code}\n' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/$REPO/pages
          } > _probe/report.txt 2>&1
          cat _probe/report.txt
      - name: commit report
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add _probe/report.txt || true
          git commit -m "probe: pages enable status" || true
          git push || true
